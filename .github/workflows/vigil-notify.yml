name: Schedule Daily Notification
 
# Runs automatically at 5:00 AM UTC every morning.
# This is before 7:45 AM in any timezone, so the notification is always
# scheduled before it is due to deliver.
#
# vigil_notify.py sets send_after to midnight UTC on the target date, so
# OneSignal always receives the request before the send_after time. It then
# delivers to each user at 7:45 AM in their own local timezone.
 
on:
  schedule:
    - cron: '0 5 * * *'   # 5:00 AM UTC daily
 
  # Allows manual triggering from the Actions tab in GitHub.
  workflow_dispatch:
 
jobs:
  notify:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: v2-build
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install openpyxl requests
 
      - name: Schedule today's notification
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 vigil_notify.py
